name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build
      - name: Package dashboard
        run: tar -czf seavxrouter-dashboard.tar.gz -C dist .
      - name: Upload dashboard release asset
        uses: actions/upload-artifact@v7
        with:
          name: seavxrouter-dashboard
          path: frontend/seavxrouter-dashboard.tar.gz
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,   suffix: linux-amd64 }
          - { goos: linux,   goarch: arm64,   suffix: linux-arm64 }
          - { goos: linux,   goarch: arm,     goarm: "7", suffix: linux-armv7 }
          - { goos: linux,   goarch: "386",   suffix: linux-386 }
          - { goos: linux,   goarch: riscv64, suffix: linux-riscv64 }
          - { goos: darwin,  goarch: amd64,   suffix: darwin-amd64 }
          - { goos: darwin,  goarch: arm64,   suffix: darwin-arm64 }
          - { goos: windows, goarch: amd64,   suffix: windows-amd64 }
          - { goos: windows, goarch: arm64,   suffix: windows-arm64 }
          - { goos: windows, goarch: "386",   suffix: windows-386 }
          - { goos: freebsd, goarch: amd64,   suffix: freebsd-amd64 }
          - { goos: freebsd, goarch: arm64,   suffix: freebsd-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM="${{ matrix.goarm }}"
          fi
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/seavxrouter-${{ matrix.suffix }}${ext}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: seavxrouter-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Refusing to release invalid tag name: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: seavxrouter-*
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum seavxrouter-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
